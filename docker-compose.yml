services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
    volumes: ["./data:/app/data"]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    command: ["sh", "-c", "voice-rag-index --all --version $${INDEX_VERSION:-server-build}"]
    profiles: ["ingestion"]
    depends_on: [qdrant, postgres]
    volumes: ["./data:/app/data"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    depends_on: [api]
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck: {test: ["CMD", "true"], interval: 10s, timeout: 5s, retries: 10}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice_rag
      POSTGRES_PASSWORD: voice_rag
      POSTGRES_DB: voice_rag
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U voice_rag -d voice_rag"], interval: 10s, timeout: 5s, retries: 10}
  postgres-init:
    image: postgres:16-alpine
    profiles: ["init"]
    environment:
      PGHOST: postgres
      PGUSER: voice_rag
      PGPASSWORD: voice_rag
      PGDATABASE: voice_rag
    volumes: ["./migrations:/migrations"]
    command: ["sh", "-c", "psql -f /migrations/001_initial.sql"]
    depends_on: [postgres]

volumes:
  qdrant_data:
  postgres_data:
