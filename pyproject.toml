[project]
name = "voice-rag"
version = "0.1.0"
description = "Production-oriented multilingual voice RAG service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "qdrant-client>=1.12,<1.20",
  "psycopg[binary]>=3.2,<4",
  "numpy>=2,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
ingest = ["datasets>=3.2,<4", "sentence-transformers>=3.3,<4"]

[project.scripts]
voice-rag-ingest = "voice_rag.ingest:main"
voice-rag-evaluate = "voice_rag.evaluation:main"
voice-rag-index = "voice_rag.index_worker:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
